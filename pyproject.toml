[project]
name = "hexlet-code"
version = "0.1.0"
dependencies = [
    "Flask>=2.2",
    "python-dotenv>=1.0",
    "gunicorn>=20.1.0",
    "psycopg2-binary>=2.9",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.1",
    "validators>=0.18.2"  # Добавлена зависимость для валидации URL
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

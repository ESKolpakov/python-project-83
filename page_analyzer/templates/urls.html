{% extends "base.html" %}

{% block title %}Сайты{% endblock %}

{% block content %}
<h1 class="mb-4">Сайты</h1>
<table class="table table-bordered table-hover text-nowrap" data-test="urls">
  <thead>
    <tr>
      <th>ID</th>
      <th>URL</th>
      <th>Дата добавления</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for site in urls %}
    <tr>
      <td>{{ site[0] }}</td>
      <td>{{ site[1] }}</td>
      <td>{{ site[2] }}</td>
      <td>
        <a class="btn btn-primary" href="{{ url_for('show_url', url_id=site[0]) }}">
          Детали
        </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

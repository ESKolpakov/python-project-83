{% extends "base.html" %}

{% block title %}Анализатор страниц{% endblock %}

{% block content %}
<h1 class="display-4 text-center">Анализатор страниц</h1>
<p class="lead text-center">Бесплатно проверяйте сайты на SEO-пригодность</p>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <form action="{{ url_for('list_urls') }}" method="POST">
      <div class="mb-3">
        <input
          type="text"
          name="url"
          class="form-control form-control-lg"
          placeholder="https://www.example.com"
          value="{{ value|default('') }}"
          required
        />
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary btn-lg w-100">
          Проверить
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

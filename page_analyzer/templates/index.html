<!-- page_analyzer/templates/index.html -->
{% extends "base.html" %}

{% block title %}Анализатор страниц{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="display-4 text-center">Анализатор страниц</h1>
    <p class="lead text-center">Бесплатно проверяйте сайты на SEO пригодность</p>
    <form method="POST" action="/">
      <div class="input-group mb-3">
        <input
          type="text"
          name="url"
          class="form-control form-control-lg"
          placeholder="https://www.example.com"
          aria-label="URL"
        />
        <button class="btn btn-primary btn-lg" type="submit">
          ПРОВЕРИТЬ
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
